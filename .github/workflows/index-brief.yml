name: Personal Daily Brief

on:
  schedule:
    - cron: "5 21 * * *" # 05:05 Asia/Taipei, first early attempt
    - cron: "35 21 * * *" # 05:35 Asia/Taipei, retry if market data lags
    - cron: "10 22 * * *" # 06:10 Asia/Taipei, final scheduled attempt
  workflow_dispatch:
    inputs:
      validation_only:
        description: Generate and verify without sending or persisting
        type: boolean
        default: false
      force_resend:
        description: Ignore today's sent marker and regenerate plus send again (manual only)
        type: boolean
        default: false

permissions:
  contents: write
  models: read

concurrency:
  group: personal-daily-brief
  cancel-in-progress: false

jobs:
  build-send:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20.18.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Resolve schedule attempt
        id: attempt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "attempt=manual" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "10 22 * * *" ]; then
            echo "attempt=final" >> "$GITHUB_OUTPUT"
          else
            # 05:05 and 05:35 (and any other schedule) defer market-failed sends.
            echo "attempt=early" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved schedule attempt: $(cat "$GITHUB_OUTPUT" | tr '\n' ' ')"

      - name: Restore reports and delivery state
        if: ${{ !inputs.validation_only }}
        run: |
          mkdir -p daily_reports
          # Full private archive (reports + valuation history). May lag if a
          # prior publish failed; delivery ledger below is the send authority.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git --work-tree=daily_reports checkout origin/gh-pages -- . || true
            rm -f daily_reports/index.html daily_reports/archive.html
          fi
          # Durable delivery ledger: restored before any send decision so a
          # prior SMTP success still blocks duplicates even if gh-pages publish failed.
          # Uses explicit refspec (not plain `git fetch origin brief-delivery`) so a
          # fresh single-branch Actions checkout creates refs/remotes/origin/brief-delivery.
          # Fail-closed: if the remote ledger exists but fetch/restore fails, this step
          # exits nonzero and SMTP must not proceed (duplicate status unknown).
          DELIVERY_LEDGER_DIR=.delivery-ledger REPORT_OUTPUT_DIR=daily_reports \
            npx tsx scripts/restore-delivery-ledger.ts

      - name: Generate or resume daily brief
        id: brief
        env:
          REPORT_TZ: Asia/Taipei
          REPORT_LOCALE: zh
          REPORT_OUTPUT_DIR: ${{ inputs.validation_only && 'validation_reports' || 'daily_reports' }}
          VALIDATION_ONLY: ${{ inputs.validation_only && '1' || '0' }}
          BRIEF_FORCE_RESEND: ${{ inputs.force_resend && '1' || '0' }}
          VALUATION_DEBUG: ${{ inputs.validation_only && '1' || '0' }}
          # Opt-in modules for private production. Market always on; tech-news explicit.
          BRIEF_MODULES: market,tech-news
          TECH_NEWS_ENABLED: "true"
          TECH_NEWS_LIMIT: "10"
          TECH_NEWS_WINDOW: "24h"
          BRIEF_SCHEDULE_ATTEMPT: ${{ steps.attempt.outputs.attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: ${{ vars.GITHUB_MODELS_MODEL || 'openai/gpt-4.1' }}
        run: npm run daily-brief

      - name: Verify generated report structure
        if: ${{ inputs.validation_only && steps.brief.outputs.status == 'generated' }}
        env:
          REPORT_DIR: ${{ steps.brief.outputs.report_dir }}
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const dir = process.env.REPORT_DIR;
            const date = path.basename(dir);
            const report = JSON.parse(fs.readFileSync(path.join(dir, `${date}.json`), "utf8"));
            const email = fs.readFileSync(path.join(dir, `${date}-email.html`), "utf8");
            if (report.version !== 1) throw new Error("expected DailyBriefReport version 1");
            if (report.editionDate !== date) throw new Error("editionDate mismatch");
            if (!Array.isArray(report.modules) || report.modules.length === 0) {
              throw new Error("modules missing");
            }
            const market = report.modules.find((m) => m.moduleId === "market");
            // Enabled market must not silently pass when failed/missing.
            // Degraded (valuation/AI translation) is tolerated; failed is not.
            if (!market) throw new Error("enabled market module missing from report");
            if (market.status === "failed" || market.status === "skipped") {
              throw new Error(`enabled market module status=${market.status}; validation_only must fail`);
            }
            if (market.status === "success" || market.status === "degraded") {
              const data = market.data;
              if (!data?.report?.commentary) throw new Error("market commentary missing");
              if (!data.report.commentary.translationAvailable) {
                console.warn(`[validation] ${date}: Chinese market translation unavailable (fallback ok)`);
              }
              if (data.report.valuation?.status !== "available") {
                if (data.report.valuation?.reason === "stale") {
                  console.warn(`[validation] ${date}: valuation stale; email should show unavailable valuation`);
                } else if (market.status === "success") {
                  throw new Error(`Valuation unavailable: ${data.report.valuation?.reason}`);
                } else {
                  console.warn(`[validation] ${date}: valuation unavailable under degraded market (ok)`);
                }
              }
            }
            if (/查看完整报告|github\.io/.test(email)) throw new Error("Stale public report link found");
            if (!/个人每日简报/.test(email)) throw new Error("Expected personal daily brief branding");
            if (!/max-width:\s*680px/.test(email)) throw new Error("Expected mobile max-width");
            console.log(`[validation] ${date}: daily brief structure verified; email is self-contained`);
          '

      - name: Send email
        id: send
        if: ${{ !inputs.validation_only && steps.brief.outputs.status != 'skip' && steps.brief.outputs.sendable != 'false' }}
        env:
          GMAIL_USER: ${{ vars.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_RECIPIENT: ${{ vars.REPORT_RECIPIENT }}
        run: npm run send-daily-brief -- "${{ steps.brief.outputs.edition_date }}"

      # Persist delivery markers immediately after SMTP success, before archive
      # publish. brief-delivery is independent of gh-pages so a later archive
      # failure cannot erase send idempotency. Irreducible window: process crash
      # after SMTP returns success but before this step completes.
      - name: Checkpoint delivery ledger after SMTP
        if: ${{ !inputs.validation_only && steps.send.outcome == 'success' }}
        env:
          REPORT_OUTPUT_DIR: daily_reports
        run: npx tsx scripts/checkpoint-delivery.ts "${{ steps.brief.outputs.edition_date }}"

      - name: Prepare private report archive
        if: ${{ !inputs.validation_only && steps.brief.outputs.status != 'skip' }}
        run: npm run build-site

      - name: Persist private report and delivery state
        if: ${{ !inputs.validation_only && steps.brief.outputs.status != 'skip' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./daily_reports
          publish_branch: gh-pages
          keep_files: false
